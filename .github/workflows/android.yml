# Build dell'app Android (widget + notifiche): test, APK release firmato e pubblicazione nella GitHub Release del tag.
name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Keystore dai secret (se presente)
        env:
          KEYSTORE_B64: ${{ secrets.BURRACO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/burraco.jks"
            echo "BURRACO_KEYSTORE=$RUNNER_TEMP/burraco.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Secret BURRACO_KEYSTORE_BASE64 mancante: una release va firmata con la chiave stabile."
            exit 1
          else
            echo "Nessuna chiave: APK firmato con la chiave debug (solo prova)."
          fi

      - name: Versione dal tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "$V"
          echo "BURRACO_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "BURRACO_VERSION_CODE=$(( MA * 10000 + MI * 100 + PA ))" >> "$GITHUB_ENV"

      - name: Test e APK release
        env:
          BURRACO_KEYSTORE_PASSWORD: ${{ secrets.BURRACO_KEYSTORE_PASSWORD }}
          BURRACO_KEY_ALIAS: ${{ secrets.BURRACO_KEY_ALIAS }}
          BURRACO_KEY_PASSWORD: ${{ secrets.BURRACO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test assembleRelease
          ls -l app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: burraco-widget
          path: android/app/build/outputs/apk/release/burraco-widget.apk

      - name: Pubblica nella Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BlS Tracker ${{ github.ref_name }}
          files: android/app/build/outputs/apk/release/burraco-widget.apk
          generate_release_notes: true
          body: |
            App Android leggerissima con i widget degli eventi di Burraco la Sfida (Corsa Pazza, Baule di Squadra, La Sfida Delle Torte) e le notifiche.
            Scarica `burraco-widget.apk`, aprilo sul telefono e consenti l'installazione da questa fonte.
            Sito: https://alessio-galbo.github.io/Burraco-la-Sfida/ — progetto di fan non ufficiale, non affiliato a WhatWapp.
