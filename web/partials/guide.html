<!-- Sezioni a tab Avvisi (browser + calendari .ics), Scarica (widget Android, iPhone); Info sta in partials/info.html. -->
<section id="avvisi" class="view" role="tabpanel" hidden>
  <div class="sec-head"><h2 class="label" data-i18n="alerts.title"></h2></div>
  <div class="panel list">
    <div id="notify-events"></div>
    <label class="switch-row"><span data-i18n="alerts.lead"></span><select id="notify-lead" class="select"></select></label>
    <div class="switch-row">
      <span class="small muted" id="notify-state"></span>
      <button type="button" class="btn btn-sm" id="notify-enable" data-i18n="alerts.enable"></button>
    </div>
  </div>
  <p class="foot" data-i18n="alerts.limit"></p>
  <div class="sec-head"><h2 class="label" data-i18n="calendars.title"></h2></div>
  <p class="lead-text" data-i18n="calendars.intro"></p>
  <p class="small cal-tip" data-i18n="calendars.tip"></p>
  <details class="cal-sub">
    <summary class="small muted" data-i18n="calendars.howTitle"></summary>
    <p class="small"><b data-i18n="calendars.howGoogleTitle"></b></p>
    <ol class="bullets small">
      <li data-i18n="calendars.howGoogle1"></li>
      <li data-i18n="calendars.howGoogle2"></li>
      <li data-i18n="calendars.howGoogle3"></li>
    </ol>
    <p class="small"><b data-i18n="calendars.howIosTitle"></b></p>
    <ol class="bullets small">
      <li data-i18n="calendars.howIos1"></li>
      <li data-i18n="calendars.howIos2"></li>
    </ol>
    <p class="small muted" data-i18n="calendars.howRemove"></p>
  </details>
  <ul id="cal-list" class="panel list cal-list"></ul>
  <details class="cal-sub">
    <summary class="small muted" data-i18n="calendars.subTitle"></summary>
    <p class="small muted" data-i18n="calendars.subText"></p>
    <div class="cal-sub-actions">
      <a class="btn btn-sm btn-ghost" id="cal-webcal" data-i18n="calendars.subIos"></a>
      <button type="button" class="btn btn-sm btn-ghost" id="cal-copy" data-i18n="calendars.copyLink"></button>
    </div>
    <p class="small muted" id="cal-copied" data-i18n="calendars.copied" hidden></p>
  </details>
</section>

<section id="scarica" class="view" role="tabpanel" hidden>
  <div class="sec-head"><h2 class="label" data-i18n="android.title"></h2></div>
  <div class="panel pad">
    <p class="lead-text" data-i18n="android.intro"></p>
    <p class="download">
      <a class="btn" href="https://github.com/Alessio-Galbo/Burraco-la-Sfida/releases/latest/download/burraco-widget.apk" target="_blank" rel="noopener"><span class="ico ico-android" aria-hidden="true"></span><span data-i18n="android.download"></span></a>
      <span class="small muted" id="apk-meta">APK · <span data-i18n="android.size"></span></span>
    </p>
    <p class="small muted apk-help" data-i18n="android.downloadHelp"></p>
    <div id="shots" class="shots"></div>
    <p id="shots-soon" class="small muted" data-i18n="android.shotsSoon" hidden></p>
    <dialog id="viewer" class="viewer">
      <button type="button" class="viewer-close icon-btn" data-i18n-aria="android.viewer.close"><span class="ico ico-x"></span></button>
      <img id="viewer-img" alt="">
      <div class="viewer-bar">
        <button type="button" id="viewer-prev" class="icon-btn" data-i18n-aria="android.viewer.prev"><span class="ico ico-left"></span></button>
        <p class="viewer-cap"><span id="viewer-cap"></span> <span id="viewer-count" class="muted"></span></p>
        <button type="button" id="viewer-next" class="icon-btn" data-i18n-aria="android.viewer.next"><span class="ico ico-right"></span></button>
      </div>
    </dialog>
    <h3 class="label" data-i18n="android.featuresTitle"></h3>
    <ul class="bullets">
      <li data-i18n="android.feat1"></li>
      <li data-i18n="android.feat2"></li>
      <li data-i18n="android.feat3"></li>
    </ul>
    <h3 class="label" data-i18n="android.howTitle"></h3>
    <ol class="bullets">
      <li data-i18n="android.how1"></li>
      <li data-i18n="android.how2"></li>
      <li data-i18n="android.how3"></li>
    </ol>
  </div>
  <div class="sec-head"><h2 class="label" data-i18n="ios.title"></h2></div>
  <div class="panel pad">
    <ol class="bullets">
      <li data-i18n="ios.step1"></li>
      <li data-i18n="ios.step2"></li>
      <li data-i18n="ios.step3"></li>
    </ol>
  </div>
</section>
